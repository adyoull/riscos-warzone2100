<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- fontconfig setup for !Warzone2100 on RISC OS. The program points
     fontconfig here for itself only (riscos/riscos_fontconfig.c).
     Paths are UnixLib paths: /<Var$Dir>/... -->
<fontconfig>
  <dir>/&lt;Warzone2100$Dir&gt;/fonts</dir>
  <cachedir>/&lt;Wimp$ScrapDir&gt;/WZ2100fc</cachedir>
  <config><rescan><int>0</int></rescan></config>
</fontconfig>
