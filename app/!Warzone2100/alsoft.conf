# OpenAL Soft's settings for Warzone 2100 (riscos/riscos_sound.c points
# ALSOFT_CONF here for the game only).
#
# period_size: samples OpenAL mixes at a time, which is also the buffer it
# asks SDL for. SDL's RISC OS driver keeps about three of them queued in
# SharedSoundBuffer: 4096 is about 280 ms at 44100 Hz, enough to carry the
# sound through busy moments. Smaller is quicker to respond but can break
# up (the old 1024 kept about 70 ms); 1024 to 8192.
[general]
period_size = 4096
